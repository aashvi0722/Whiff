AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Whiff API (stub phase, serves the contract samples)

Parameters:
  FirmsKey:
    Type: String
    NoEcho: true

Globals:
  Function:
    Runtime: python3.12
    Timeout: 20
    MemorySize: 256
    Environment:
      Variables:
        TABLE: !Ref WhiffCache
        FIRMS_KEY: !Ref FirmsKey

Resources:
  WhiffApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Tags:
        Project: Whiff
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowMethods: [GET]
        AllowHeaders: ['*']

  WhiffCache:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}

  SmokeFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: smoke.handler
      Timeout: 28
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref WhiffCache}
      Events:
        Get:
          Type: HttpApi
          Properties: {ApiId: !Ref WhiffApi, Path: /smoke, Method: GET}

  DayFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: day.handler
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref WhiffCache}
      Events:
        Get:
          Type: HttpApi
          Properties: {ApiId: !Ref WhiffApi, Path: /day, Method: GET}

  HistoryFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: history.handler
      Events:
        Get:
          Type: HttpApi
          Properties: {ApiId: !Ref WhiffApi, Path: /history, Method: GET}

  ReplaysFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: replays.handler
      Events:
        Get:
          Type: HttpApi
          Properties: {ApiId: !Ref WhiffApi, Path: /replays, Method: GET}

  IngestFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: ingest.handler
      Timeout: 90
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref WhiffCache}
      Events:
        Hourly:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Description: Hourly refresh of fire clusters and per-city results

  # ---------- Frontend hosting: private S3 bucket served by CloudFront over HTTPS ----------
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-frontend-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Whiff frontend
        DefaultRootObject: index.html
        HttpVersion: http2and3
        Origins:
          - Id: s3-frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOac.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: s3-frontend
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # managed: CachingOptimized
        CustomErrorResponses:   # single-page app: unknown paths load index.html
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'

Outputs:
  ApiUrl:
    Value: !Sub 'https://${WhiffApi}.execute-api.${AWS::Region}.amazonaws.com'
  FrontendUrl:
    Value: !Sub 'https://${FrontendDistribution.DomainName}'
  FrontendBucket:
    Value: !Ref FrontendBucket
  FrontendDistributionId:
    Value: !Ref FrontendDistribution
