<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whiff</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:system-ui,sans-serif;
         background:linear-gradient(135deg,#0ea5e9,#6366f1,#ec4899); color:#0f172a; }
  .card { background:rgba(255,255,255,.75); backdrop-filter:blur(20px); border-radius:24px; padding:32px; max-width:420px; margin:16px; text-align:center; }
  h1 { margin:0 0 4px; font-size:2.4rem; } p { margin:8px 0; }
  #live { margin-top:16px; font-weight:600; }
</style>
</head>
<body>
  <div class="card">
    <h1>Whiff</h1>
    <p>Know when the smoke is coming.</p>
    <p>The app is being deployed. This placeholder confirms the HTTPS hosting works.</p>
    <p id="live">Checking the live API...</p>
  </div>
<script>
  // Cross-origin call from CloudFront to the API: also proves CORS works in a real browser.
  var API = "https://x5kcojkqsb.execute-api.ap-south-1.amazonaws.com";
  var el = document.getElementById("live");
  fetch(API + "/smoke?lat=28.61&lon=77.21")
    .then(function (r) { return r.json(); })
    .then(function (d) {
      el.textContent = d.risk ? "Delhi smoke risk right now: " + d.risk +
        (d.arrival_hours ? " (about " + d.arrival_hours + " h away)" : "") : "API answered with an error";
    })
    .catch(function () { el.textContent = "Could not reach the API"; });
</script>
</body>
</html>
